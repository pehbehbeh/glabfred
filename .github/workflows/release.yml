name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - if: ${{ steps.release.outputs.release_created }}
        run: sh scripts/build.sh
      - if: ${{ steps.release.outputs.release_created }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} dist/glabfred.alfredworkflow
        env:
          GH_TOKEN: ${{ github.token }}
